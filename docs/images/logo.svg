<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Scenecaster">
  <title>Scenecaster</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="phaser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- scene frame: corner brackets -->
  <g fill="none" stroke="#e8f4ff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 92 V60 a8 8 0 0 1 8-8 H92"/>
    <path d="M164 52 H196 a8 8 0 0 1 8 8 V92"/>
    <path d="M204 164 V196 a8 8 0 0 1-8 8 H164"/>
    <path d="M92 204 H60 a8 8 0 0 1-8-8 V164"/>
  </g>
  <!-- placed object -->
  <rect x="98" y="98" width="60" height="60" rx="10" fill="url(#phaser)"/>
  <!-- move gizmo: x and y axes from the object -->
  <g stroke="#e8f4ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M166 128 H190 M182 120 l8 8-8 8"/>
    <path d="M128 90 V66 M120 74 l8-8 8 8"/>
  </g>
</svg>
